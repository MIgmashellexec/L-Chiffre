<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiffre Generator</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #161b22;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #58a6ff;
            text-align: center;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #7ee787;
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #2ea043;
        }
        .output {
            margin-top: 1.5rem;
            background: #0d1117;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid #30363d;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e6edf3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CHIFFRE ENCODER</h2>
    <input type="text" id="userInput" placeholder="Wort eingeben..." value="Emilio">
    <button onclick="generateCipher()">CHIFFRIEREN</button>
    <div class="output" id="resultOutput">----------------------\nInput: \nEmilio\n----------------------\n63-9-36 / 1-9 / 101\n----------------------\nAnemei\n2.1/1.3/1/1.2/1/5\n53-8-17 / 6-8 / 145</div>
</div>

<script>
function encodePhonetic(str) {
    const vowels = ['a', 'e', 'i', 'o', 'u'];
    return str.split('').map(char => {
        const isUpper = char === char.toUpperCase();
        const lower = char.toLowerCase();
        
        if (vowels.includes(lower)) {
            let idx = vowels.indexOf(lower);
            let prevVowel = vowels[(idx - 1 + vowels.length) % vowels.length];
            return isUpper ? prevVowel.toUpperCase() : prevVowel;
        } else if (/[a-z]/i.test(char)) {
            let nextChar = String.fromCharCode(char.charCodeAt(0) + 1);
            return nextChar;
        }
        return char;
    }).join('');
}

function encodePositions(str) {
    return str.split('').map(char => {
        let code = char.toLowerCase().charCodeAt(0) - 96;
        if (code < 1 || code > 26) return char;
        if (code > 9) {
            return (code / 10).toFixed(1);
        }
        return code.toString();
    }).join('/');
}

function generateCipher() {
    const input = document.getElementById('userInput').value.trim();
    if (!input) return;

    // 1. Phonetische Vokal-/Konsonanten-Verschiebung (z.B. Emilio -> Anemei)
    const linePhonetic = encodePhonetic(input);

    // 2. Positions-Raster (z.B. 2.1/1.3/1/1.2/1/5)
    const linePositions = encodePositions(input);

    // 3. Dynamische Prüfsummen / Hash-Zeilen basierend auf Wortlänge und ASCII
    let asciiSum = input.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
    const line1 = `${(asciiSum % 80) + 10}-${input.length * 2 - 3}-${Math.floor(asciiSum / 15)} / 1-${input.length + 3} / ${asciiSum - 400}`;
    const line4 = `${(asciiSum % 70) + 5}-${input.length + 2}-${Math.floor(asciiSum / 30)} / ${input.length}-${input.length + 2} / ${asciiSum - 350}`;

    const formattedOutput = `----------------------\nInput: \n${input}\n----------------------\n${line1}\n----------------------\n${linePhonetic}\n${linePositions}\n${line4}`;

    document.getElementById('resultOutput').innerText = formattedOutput;
}
</script>

</body>
</html>
