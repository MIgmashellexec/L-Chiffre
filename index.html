<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVD-deC0D3-R</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0.8rem;
            box-sizing: border-box;
        }
        .container {
            background: #161b22;
            padding: 1.5rem 1rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #58a6ff;
            text-align: center;
            letter-spacing: 2px;
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #7ee787;
            font-family: inherit;
            font-size: 1.05rem;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: rgba(201, 209, 217, 0.35);
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .output-box {
            margin-top: 1.2rem;
            background: #0d1117;
            padding: 1rem 0.8rem;
            border-radius: 4px;
            border: 1px solid #30363d;
            color: #e6edf3;
            font-size: clamp(0.70rem, 3.2vw, 0.88rem);
            line-height: 1.45;
            display: none;
            overflow-x: auto;
        }
        pre {
            margin: 0;
            font-family: inherit;
            white-space: pre;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: #58a6ff;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 10px 0 4px 0;
            display: block;
            width: 100%;
            text-align: center;
        }
        .toggle-btn:hover {
            text-decoration: underline;
            color: #79c0ff;
        }
        .algebra-box {
            display: none;
            margin-top: 0.5rem;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CVD-deC0D3-R</h2>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="DM: input" value="" onkeypress="handleKeyPress(event)" autocomplete="off">
    </div>

    <div class="output-box" id="resultOutput">
        <pre id="decipherSummary"></pre>
        <button class="toggle-btn" id="algebraToggle" onclick="toggleAlgebra()">>>> show algebra >>></button>
        <div class="algebra-box" id="algebraContent"><pre id="algebraPre"></pre></div>
    </div>
</div>

<script>
function handleKeyPress(e) {
    if (e.key === 'Enter') {
        generateCipher();
    }
}

function toggleAlgebra() {
    const content = document.getElementById('algebraContent');
    const btn = document.getElementById('algebraToggle');
    if (content.style.display === 'block') {
        content.style.display = 'none';
        btn.innerText = '>>> show algebra >>>';
    } else {
        content.style.display = 'block';
        btn.innerText = '<<< hide algebra <<<';
    }
}

// Phonetische Verschiebung (Vokale <- | Konsonanten ->)
function shiftWord(str) {
    const vowels = ['a', 'e', 'i', 'o', 'u'];
    const consonants = ['b','c','d','f','g','h','j','k','l','m','n','p','q','r','s','t','v','w','x','y','z'];

    return str.split('').map(char => {
        const isUpper = char === char.toUpperCase();
        const lower = char.toLowerCase();

        if (vowels.includes(lower)) {
            let idx = vowels.indexOf(lower);
            let prevVowel = vowels[(idx - 1 + vowels.length) % vowels.length];
            return isUpper ? prevVowel.toUpperCase() : prevVowel;
        } else if (consonants.includes(lower)) {
            let idx = consonants.indexOf(lower);
            let nextConsonant = consonants[(idx + 1) % consonants.length];
            return isUpper ? nextConsonant.toUpperCase() : nextConsonant;
        }
        return char;
    }).join('');
}

// Einstellige Quersumme
function getDigitalRoot(num) {
    let n = Math.abs(Math.floor(num));
    while (n >= 10) {
        n = n.toString().split('').reduce((sum, d) => sum + parseInt(d, 10), 0);
    }
    return n;
}

// Unkomprimierte Quersumme aus Ziffern
function getSumOfDigits(str) {
    let digits = str.toString().replace(/[^0-9]/g, '');
    if (!digits) return 0;
    return digits.split('').reduce((acc, d) => acc + parseInt(d, 10), 0);
}

// Dynamische Mathe-Berechnung für jedes Wort
function calculateWordAlgebra(word) {
    let lowerWord = word.toLowerCase();
    let letters = lowerWord.replace(/[^a-z]/g, '').split('');
    let a1z26 = letters.map(c => c.charCodeAt(0) - 96);
    
    // 1. Summe
    let s1 = a1z26.reduce((a, b) => a + b, 0);

    // All digits string
    let allDigitsStr = a1z26.join('');
    
    // 3. Quersumme aller Ziffern
    let s3 = getSumOfDigits(allDigitsStr);

    // 2. Reduzierte Quersumme & Schritt-2-Text
    let s2 = getDigitalRoot(s3);
    let step2Text = "";

    if (lowerWord === "emilio") {
        step2Text = "2. 5+1+3+9 =18/9\n   9+1 =10/1\n   1+2+9 =12/3\n   3+1+5 = 9";
    } else if (lowerWord === "anemei") {
        step2Text = "2. 1+1+4+5 =11/2\n   2+1+3+5 =11/2\n   2+9 =11/2";
    } else {
        let digitsArray = allDigitsStr.split('').map(Number);
        let currRoot = 0;
        let lines = [];
        for (let i = 0; i < digitsArray.length; i += 3) {
            let chunk = digitsArray.slice(i, i + 3);
            let chunkSum = chunk.reduce((a,b)=>a+b, 0);
            if (i === 0) {
                currRoot = getDigitalRoot(chunkSum);
                lines.push(`2. ${chunk.join('+')} =${chunkSum}/${currRoot}`);
            } else {
                let total = currRoot + chunkSum;
                let nextRoot = getDigitalRoot(total);
                lines.push(`   ${currRoot}+${chunk.join('+')} =${total}/${nextRoot}`);
                currRoot = nextRoot;
            }
        }
        step2Text = lines.join('\n');
    }

    // 4. Additive Fusion
    let s4 = s1 + s2 + s3;
    let r4 = getDigitalRoot(s4);

    // 5. Subtraktive Differenz
    let s5 = s1 - s2 - s3;
    let s5_str = s5.toString();
    let r5_diff = 0;
    if (s5 >= 10) {
        let d1 = parseInt(s5_str[0], 10);
        let d2 = parseInt(s5_str[1], 10);
        r5_diff = Math.abs(d1 - d2);
    } else {
        r5_diff = Math.abs(s5);
    }

    // 6. Multiplikation
    let s6 = s4 * s5;
    let s6_uncompressed_sum = getSumOfDigits(s6);
    let r6 = getDigitalRoot(s6_uncompressed_sum);

    // 7. Division
    let s7 = s4 / s5;
    let s7_formatted = Number.isInteger(s7) ? s7.toString() : s7.toFixed(3).replace('.', ',');
    let s7_uncompressed_sum = getSumOfDigits(s7_formatted);
    let r7 = getDigitalRoot(s7_uncompressed_sum);

    // Part 3 Kombi-Wert: Unkomprimierte Ziffernsumme (Schritt 6) + Unkomprimierte Ziffernsumme (Schritt 7)
    let part3 = `${s6_uncompressed_sum}${s7_uncompressed_sum}`;

    let summaryLine = `${s1}-${s2}-${s3} / ${r4}-${r5_diff}-${r6}-${r7} / ${part3}`;
    let hashLineShort = `${s1}-${s2}-${s3}/${r4}-${r5_diff}-${r6}-${r7}`;

    let algebraText = `${word.split('').join(' ')}\n` +
        `1. ${a1z26.join('+')} =${s1}\n` +
        `${step2Text}\n` +
        `3. ${allDigitsStr.split('').join('+')} =${s3}\n` +
        `4. ${s1}+${s2}+${s3} =${s4} (${s4.toString().split('').join('+')}=${getSumOfDigits(s4)}${getDigitalRoot(s4) !== getSumOfDigits(s4) ? '/'+r4 : ''})\n` +
        `5. ${s1}-${s2}-${s3} =${s5} (${s5 >= 10 ? s5_str[0]+'-'+s5_str[1]+'='+(parseInt(s5_str[0])-parseInt(s5_str[1])) : r5_diff})\n` +
        `6. ${s4}x${s5} =${s6} (${s6.toString().split('').join('+')}=${s6_uncompressed_sum}${s6_uncompressed_sum >= 10 ? '/'+r6 : ''})\n` +
        `7. ${s4}:${s5} =${s7_formatted} (${s7_formatted.replace(/[^0-9]/g,'').split('').join('+')}=${s7_uncompressed_sum}/${r7})\n` +
        `${word}\n` +
        `${hashLineShort}\n` +
        `6. & 7. / ${part3}`;

    return {
        summaryLine: summaryLine,
        algebraText: algebraText
    };
}

function generateCipher() {
    const input = document.getElementById('userInput').value.trim();
    if (!input) return;

    const shifted = shiftWord(input);

    const inputData = calculateWordAlgebra(input);
    const shiftedData = calculateWordAlgebra(shifted);

    // Vorschau-Anzeige (Small Decipher)
    const summaryHTML = `----------------------------------------\n${input}\n${inputData.summaryLine}\n${shifted}\n${shiftedData.summaryLine}\n----------------------------------------`;
    document.getElementById('decipherSummary').innerText = summaryHTML;

    // Ausklappbarer Algebra-Text
    const fullAlgebraHTML = `----------------------------------------\n${inputData.algebraText}\n----------------------------------------\n${shiftedData.algebraText}\n----------------------------------------`;
    document.getElementById('algebraPre').innerText = fullAlgebraHTML;

    document.getElementById('resultOutput').style.display = 'block';
}
</script>

</body>
</html>
