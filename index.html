<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-Chiffre Generator</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .container {
            background: #161b22;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #58a6ff;
            text-align: center;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #7ee787;
            font-family: inherit;
            font-size: 1.1rem;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #2ea043;
        }
        .output {
            margin-top: 1.5rem;
            background: #0d1117;
            padding: 1.2rem;
            border-radius: 4px;
            border: 1px solid #30363d;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e6edf3;
            font-size: 1rem;
            line-height: 1.5;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>L-CHIFFRE ENCODER</h2>
    <input type="text" id="userInput" placeholder="Wort eingeben..." value="" onkeypress="handleKeyPress(event)">
    <button onclick="generateCipher()">CHIFFRIEREN</button>
    <div class="output" id="resultOutput"></div>
</div>

<script>
function handleKeyPress(e) {
    if (e.key === 'Enter') {
        generateCipher();
    }
}

// Einstellige Quersumme
function getQuersumme(num) {
    let n = Math.abs(num);
    while (n >= 10) {
        n = n.toString().split('').reduce((sum, d) => sum + parseInt(d, 10), 0);
    }
    return n;
}

// Quersumme aus allen Ziffern eines Strings
function getQuersummeFromString(str) {
    let digits = str.replace(/[^0-9]/g, '');
    if (!digits) return 0;
    let sum = digits.split('').reduce((acc, d) => acc + parseInt(d, 10), 0);
    return getQuersumme(sum);
}

// A1Z26 Code (Alphabet-Positionen: A=1, B=2 ... Z=26)
function encodeA1Z26(str) {
    return str.split('').map(char => {
        let code = char.toLowerCase().charCodeAt(0) - 96;
        if (code >= 1 && code <= 26) {
            return code;
        }
        return char;
    }).join('/');
}

// Phonetische Verschiebung
function encodePhonetic(str) {
    const vowels = ['a', 'e', 'i', 'o', 'u'];
    return str.split('').map(char => {
        const isUpper = char === char.toUpperCase();
        const lower = char.toLowerCase();
        
        if (vowels.includes(lower)) {
            let idx = vowels.indexOf(lower);
            let prevVowel = vowels[(idx - 1 + vowels.length) % vowels.length];
            return isUpper ? prevVowel.toUpperCase() : prevVowel;
        } else if (/[a-z]/i.test(char)) {
            if (lower === 'z') {
                return isUpper ? 'B' : 'b';
            }
            let nextCharCode = char.charCodeAt(0) + 1;
            let nextChar = String.fromCharCode(nextCharCode);
            
            if (vowels.includes(nextChar.toLowerCase())) {
                nextChar = String.fromCharCode(nextCharCode + 1);
            }
            return nextChar;
        }
        return char;
    }).join('');
}

// Reine ASCII-Werte
function encodeASCII(str) {
    return str.split('').map(c => c.charCodeAt(0)).join('/');
}

function generateCipher() {
    const input = document.getElementById('userInput').value.trim();
    if (!input) return;

    const lineA1Z26 = encodeA1Z26(input);
    const linePhonetic = encodePhonetic(input);
    const lineASCII = encodeASCII(input);

    let asciiSum = input.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
    let len = input.length;

    // ZEILE 1 (HASH)
    let p1_1 = (asciiSum * 3) % 89 + 10;
    let p1_2 = len * 2 + 1;
    let p1_3 = (asciiSum % 40) + 10;
    let part1 = `${p1_1}-${p1_2}-${p1_3}`;
    
    let X1 = getQuersummeFromString(part1);
    let Y1 = (asciiSum % 8) + 2; 
    let sum1 = X1 + Y1;
    let q1 = getQuersumme(sum1);
    let Z1 = `${sum1}${q1}`; 
    let line1 = `${part1} / ${X1}-${Y1} / ${Z1}`;

    // ZEILE 4 (HASH)
    let p2_1 = (asciiSum * 2) % 79 + 10;
    let p2_2 = len + 2;
    let p2_3 = (asciiSum % 30) + 10;
    let part2 = `${p2_1}-${p2_2}-${p2_3}`;

    let X2 = getQuersummeFromString(part2);
    let Y2 = ((asciiSum + len) % 8) + 2;
    let sum2 = X2 + Y2;
    let q2 = getQuersumme(sum2);
    let Z2 = `${sum2}${q2}`; 
    let line4 = `${part2} / ${X2}-${Y2} / ${Z2}`;

    // Exaktes Format mit A1Z26 Grundwert
    const outputText = `----------------------\nInput: \n${input}\n----------------------\n${line1}\n----------------------\n${lineA1Z26}\n${linePhonetic}\n${lineASCII}\n${line4}`;

    const outputEl = document.getElementById('resultOutput');
    outputEl.innerText = outputText;
    outputEl.style.display = 'block';
}
</script>

</body>
</html>
